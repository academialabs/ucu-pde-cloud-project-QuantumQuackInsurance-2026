<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuantumQuack Insurance · Subir fotos del siniestro</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6f8; color: #1d2733; }
    main { max-width: 460px; margin: 48px auto; background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { margin: 0 0 24px; color: #5b6774; font-size: 14px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #cfd6dd; border-radius: 8px; font-size: 15px; }
    button { margin-top: 24px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #1a6fd1; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #9bb8dc; cursor: default; }
    #status { margin-top: 16px; font-size: 14px; min-height: 20px; }
    .ok { color: #1c7c3c; } .err { color: #b3261e; }
    small { color: #5b6774; }
  </style>
</head>
<body>
  <main>
    <h1>Subir fotos del siniestro</h1>
    <p class="sub">QuantumQuack Insurance</p>
    <form id="f">
      <label for="claim">Número de siniestro</label>
      <input id="claim" required maxlength="40" placeholder="Ej. QQ-2026-0042" />
      <label for="file">Foto</label>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" required />
      <small>JPG, PNG o WEBP. Máximo 10 MB.</small>
      <button id="btn" type="submit">Subir foto</button>
      <div id="status"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById("f");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("btn");
    const show = (msg, cls) => { statusEl.textContent = msg; statusEl.className = cls || ""; };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("file").files[0];
      const claimId = document.getElementById("claim").value.trim();
      if (!file) return;
      btn.disabled = true;
      try {
        show("Preparando la subida…");
        const r = await fetch("/api/upload-url", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contentType: file.type, size: file.size, claimId }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error);

        show("Subiendo la foto…");
        const put = await fetch(data.url, {
          method: "PUT",
          headers: { "Content-Type": file.type, "x-goog-content-length-range": `0,${data.maxBytes}` },
          body: file,
        });
        if (!put.ok) throw new Error("Cloud Storage rechazó la subida (" + put.status + ").");
        show("Listo. Foto recibida.", "ok");
        form.reset();
      } catch (err) {
        show(err.message || "Algo salió mal.", "err");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
